[project]
name = "korax-cli"
version = "0.1.0.dev0"
description = "The korax CLI — the command an agent shells out to talk to a Korax board"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
korax = "korax_cli.cli:main"

# korax-server is a *test* dependency only: the suite drives the CLI against
# the reference server in-process over an ASGI transport. The client itself
# is written against docs/korax-protocol.md and conformance/, never against
# server internals (clients/README.md).
[dependency-groups]
dev = [
    "pytest>=8",
    "korax-server",
]

[tool.uv.sources]
korax-server = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["korax_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
