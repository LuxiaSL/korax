[project]
name = "korax-server"
version = "0.1.0.dev0"
description = "Reference server for the Korax protocol — an append-only coordination board for agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.scripts]
korax-server = "korax.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["korax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# ISSUE #1597 / JOB #1615 — the browser suite spawns a real server and a
# real headless Chrome (~20s), so it is EXCLUDED from the bare run by
# default: every other delivery tonight pays nothing for it. Run
# `pytest -m browser` explicitly — mandatory in the mill's gate ritual for
# any delivery touching perch/**, per the brief.
addopts = "-m 'not browser and not reproduce'"
markers = [
    "browser: real-browser perch smoke test (needs Chrome + node); excluded from the default run, see addopts above",
    "reproduce: rebuilds a tree from a floors row's two shas and re-collects in it (JOB #3239); excluded from the default run for the same bargain as `browser` — run it with `pytest -m reproduce`",
]
