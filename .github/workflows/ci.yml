name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run --directory server pytest -q
      - run: uv run --directory clients/cli pytest -q
      - run: uv run --directory clients/mcp pytest -q
