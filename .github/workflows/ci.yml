name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  conformance:
    runs-on: ubuntu-latest
    # Set only on the merge target. `R-NEXT` is CORRECT on an in-flight
    # branch, so the strict "the desk substituted the number" assertion in
    # server/tests/test_revisions_ledger.py must not fire on a PR build.
    # Named for the context rather than the check, so the next merge-target-
    # only assertion reuses it instead of inventing a second flag (#753).
    env:
      KORAX_MERGE_TARGET: ${{ github.ref == 'refs/heads/main' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # JOB #507 — the charter's derived artifacts must match charter.md.
      # Before this, `do not edit by hand` was an instruction with nothing
      # behind it: the version went unenforced through six bumps while the
      # README sat at 1.0.0 and the charter reached 1.6.0 (#702).
      - run: python tools/charter_build.py --check
      - run: uv run --directory server pytest -q
      - run: uv run --directory clients/cli pytest -q
      - run: uv run --directory clients/mcp pytest -q
      # ISSUE #1669 — the browser leg (R94's perch smoke) is excluded from a
      # bare pytest by design (`addopts = -m 'not browser'`), so unless CI
      # types `-m browser` the guard only ever runs when a human remembers
      # to. And per #1697's ruling: HERE — where run 31546925763 proved the
      # runner ships Chrome — the leg is REQUIRED, so a missing dependency
      # fails naming itself instead of soft-skipping inside a green
      # pipeline. Local runs never see this variable and keep wren's skip.
      - run: uv run --directory server pytest -q -m browser
        env:
          KORAX_BROWSER_REQUIRED: "1"

  # JOB #2260 — the annotations start being checked. A LANE, failing
  # independently, deliberately NOT a step folded into `conformance`: a
  # checker finding and a failing test are different facts and a reader
  # should be able to tell which one went red without opening the log.
  #
  # `needs:` is absent on purpose. This must run even when the suites are
  # red — a type error is often WHY they are red, and a lane gated behind
  # them would be silent in exactly the run where it had the answer.
  #
  # THE INVOCATION IS THE LOCAL ONE, character for character — and since
  # ISSUE #2378 (ruled #2379) that invocation is the WRAPPER, not the two
  # bare tool commands. The wrapper prints `korax tree:`, the sha and the
  # working-tree state before running both checkers, so a lane result
  # stops being a string whose provenance a reader reconstructs later.
  #
  # This line and the one a band runs locally must stay identical: that
  # is the property R131 was built around, and the reason the switch is
  # in the same delivery as the wrapper rather than after it. The bare
  # `uv run ruff check .` is still fine mid-work; it is just not citable
  # as delivery evidence, exactly as a suite number without R130's tree
  # line already is.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run tools/type_lane.py

  # JOB #163 part 3. NOT a rewrite of the job above: that job already did
  # what the brief asked for (three suites, separately, push and PR) as of
  # R37, and #794 warned specifically that a rewrite would silently eat
  # `KORAX_MERGE_TARGET` and disarm half the revisions guard with nothing
  # failing to say so. So this ADDS a lane and leaves that one alone.
  deploy-script:
    runs-on: ubuntu-latest
    needs: conformance
    steps:
      - uses: actions/checkout@v4
      # The script is DELIVERED but never run from CI: its first live run is
      # the desk's, observed (#163's conduct notes). What CI can honestly
      # assert is that it parses and that it refuses to start without its
      # environment — a deploy script that half-works is worse than one that
      # will not begin.
      - name: the deploy script parses
        run: bash -n tools/deploy.sh
      - name: it refuses to run unconfigured rather than guessing
        run: |
          if env -u KORAX_DEPLOY_PROFILE -u KORAX_VPS -u KORAX_VPS_DIR \
                 -u KORAX_HOST_DIR -u KORAX_SERVICE -u KORAX_URL \
                 bash tools/deploy.sh --dry-run; then
            echo "deploy.sh started with no configuration — it must refuse" >&2
            exit 1
          fi
