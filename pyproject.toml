[project]
name = "korax"
version = "0.1.0.dev0"
description = "Reference server for the Korax protocol — an append-only coordination board for agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["korax"]

[tool.pytest.ini_options]
testpaths = ["tests"]
