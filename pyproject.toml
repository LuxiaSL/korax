# Workspace root — virtual, not a package. Server and clients live as
# members so they version and install independently but share one repo,
# one lockfile, and one conformance suite.
[tool.uv.workspace]
members = ["server", "clients/cli", "clients/mcp"]

# The type lane's tools live HERE, at the root, for the reason the brief
# gives: the local invocation and the CI invocation must be the same
# command. `uv run --directory <member> ...` would give each member its
# own checker settings and its own idea of what the workspace contains —
# and the defects this lane exists to catch cross those boundaries (the
# clients are written against the server's models). One root, one config,
# one command.
[dependency-groups]
dev = [
    "mypy>=1.18",
    "ruff>=0.16",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
# The suites and the tools are checked too. A lane that skips the tests
# is a lane that does not check the code most likely to drift, since a
# test is where a wrong assumption about a signature is first written
# down.
extend-exclude = [".venv", "clients/charter/fragments"]

[tool.ruff.lint]
# **`select` IS DECLARED, and that is load-bearing rather than tidy.**
# ruff's own default is not stable across releases: 0.16.3 enables 413
# rules across 38 families, where the documented historical default was
# `E4,E7,E9,F` (~60). A lane that inherits the default therefore silently
# changes what it checks whenever the tool is upgraded — the exact shape
# of defect this lane was cut to stop, wearing the lane's own clothes.
# So the rule set is the repo's statement, not the tool's, and the
# version floor in `[dependency-groups]` is the other half of that.
#
# **Chosen for DEFECTS, not style**, because the brief rules formatting
# out of scope and the priced instance on the log (`e["id"]` on an
# `Envelope`) is a correctness bug. The families left out were left out
# on measurement, not taste — selecting them produced 102 findings of
# which zero were defects: 29 unused-unpacked-variable, 9 `dict()`-vs-`{}`,
# 9 suppressible-exception, 7 literal-concatenation, 4 ambiguous-unicode
# (false positives on this codebase's own em-dashes), 3 unnecessary
# allocations, 2 multiple-startswith, plus 54 line-too-long and 88
# import-order. Selecting those and then suppressing them one by one
# would leave a config that is mostly suppressions — unreadable, and
# indistinguishable from a lane that had been quietly switched off.
select = [
    "F",       # pyflakes — undefined names, unused imports. Found the
               # `Any` that was never imported: under `from __future__
               # import annotations` the annotation is a string that never
               # evaluates, so it was unresolvable and silent.
    "E4",      # import errors
    "E7",      # comparison/statement errors — `== None`, bare `except`,
               # type-comparison. NOT E5: line length is formatting.
    "E9",      # syntax and runtime errors
    "B",       # bugbear — loop-variable capture, `zip()` truncation,
               # mutable defaults
    "ASYNC",   # this codebase is async end to end, and #1628 measured what
               # one blocking call costs when every band's watch is parked
    "DTZ",     # naive datetimes — the board's whole clock discipline (#690,
               # `board_ts` vs `eval_ts`) is about which clock a value came
               # from, and a naive one has erased the answer
    "PLE",     # pylint ERRORS only, never its opinions
    "PLW1510", # `subprocess.run` without `check=` — the swallowed-exit-code
               # class the board already filed as ISSUE #2085
    "LOG",     # logging misuse
    "G",       # logging format misuse
    "UP",      # pyupgrade — keeps annotations current, which is precisely
               # this lane's subject matter
]

# ── NARROWS: 8 ruff codes across 4 scopes, each with its count and reason ──
#   global (2):        E741 (4), E731 (3)
#   */tests/* (4):     PLW1510 (12), DTZ007 (4), F811, ASYNC240 (4)
#   cli.py (2):        UP031 (1), ASYNC240 (6)
#   tools/ (1):        ASYNC240 (1)
#
# ASYNC240 IS NO LONGER GLOBALLY IGNORED — it is ENFORCED on the MCP blob
# path, which is the only place the measurement found a real stall.
# #2598 measured every class against a 1.303 ms idle baseline:
#
#   expanduser() only (NO disk I/O)   -0.030 ms   <- the rule flags Path
#   brief 3.4 KB (korax_brief)        +0.009 ms      METHODS, not I/O
#   blob 8 MiB (attach/fetch CAP)     +3.178 ms   <- the only one above noise
#   256 MB slow control             +214.3   ms   <- proves the rig can see
#
# The 3.2 ms is FIXED at its two sites (`to_thread`, ruled #2599) rather
# than accepted, so the code now enforces where it earns its keep. The
# narrows below are the measured-zero classes, scoped rather than blanket:
# a global ignore covering four sites that do no I/O at all was the state
# #2298 called unacceptable, and it is now decided rather than deferred.
# mypy adds 2 inline coded ignores (validate.py, wire.py) and 2 module
# overrides (rfc8785, mcp.*) — all four stated at their sites.
#
# No blanket `ignore`, no excluded package, no `ignore_errors`. Each entry
# below is a specific code with a specific justification; an exclusion
# that swallowed a package would be the lane lying about its own coverage.
ignore = [
    # 4 sites. Ambiguous single-character names (`l`, `I`). Style, and the
    # sites are short comprehensions where the name is local and obvious.
    "E741",
    # 3 sites. Assigning a lambda instead of using `def`. Style.
    "E731",
]

[tool.ruff.lint.per-file-ignores]
# Path-scoped narrows, also per-code and also counted.
"*/tests/*" = [
    # 12 sites. `subprocess.run` without `check=` in the perch/browser
    # rigs, where the call's success is asserted by the lines that follow
    # it — the test IS the check. Kept selected for non-test code, where
    # an unchecked exit code is ISSUE #2085's defect exactly.
    "PLW1510",
    # 4 sites. `strptime` without `%z` on strings the BOARD emitted in
    # RFC3339 — the timezone is known because the test wrote it. In
    # non-test code this stays on, which is where the clock discipline
    # actually matters.
    "DTZ007",
    # A test may shadow a fixture name by design — that IS the pytest
    # fixture protocol, and the checker cannot tell it from a redefinition.
    "F811",
    # 4 sites. A test rig's own file I/O, not a served path — no doorbell
    # and no concurrent tool call is waiting on a fixture's `read_text`.
    # Kept ENFORCED for non-test code, which is where #2598 found the
    # 3.2 ms that got fixed.
    "ASYNC240",
]
"clients/cli/korax_cli/cli.py" = [
    # 1 site, and a genuine FALSE POSITIVE: the `%(url)s` in `EPILOG` is
    # argparse's own interpolation, not Python's. "Fixing" it to an f-string
    # would break the help text this lane is not here to touch.
    "UP031",
    # 6 sites. The CLI is a ONE-SHOT process: a blocked loop with a single
    # task on it costs nothing, because there is no doorbell and no
    # concurrent call to stall. Four of the six are `Path(...).expanduser()`
    # and do no disk I/O at all — measured at -0.030 ms, i.e. zero (#2598).
    # The MCP client, which holds a long-lived connection, keeps this
    # ENFORCED, and that asymmetry is the whole reason this is scoped here
    # rather than globally.
    "ASYNC240",
]
"tools/korax_export.py" = [
    # 1 site. A one-shot export tool writing its own output page; same
    # one-shot reasoning as the CLI above, and nothing is parked on it.
    "ASYNC240",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------

[tool.mypy]
python_version = "3.11"
files = ["server/korax", "clients/cli/korax_cli", "clients/mcp/korax_mcp", "tools"]
# The pydantic plugin is not optional here. The models are the richest
# annotations in the tree — `Envelope`, `Submission`, the wire models —
# and without the plugin mypy cannot see what `BaseModel` generates, so
# every model access degrades to `Any` and the lane goes quiet on exactly
# the code it most needs to check (brief: "excluding them guts the lane").
plugins = ["pydantic.mypy"]

# The floor, and it is deliberately not `strict`. `strict` on a codebase
# with no prior checker turns into a wall of narrows, and a lane whose
# config is mostly suppressions is a lane nobody can read. These are the
# checks that catch the `e["id"]` class — wrong member, wrong shape, a
# return type that does not match what the body returns.
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
no_implicit_optional = true
strict_equality = true
check_untyped_defs = true

# `disallow_untyped_defs` is OFF workspace-wide and ON where the
# annotations already exist — see the per-module sections below. Turning
# it on everywhere would flag test helpers that were never annotated and
# were never claimed to be, which is noise, not coverage.
disallow_untyped_defs = false

[[tool.mypy.overrides]]
# `rfc8785` (JSON canonicalisation, used only by tools/sign_fixture.py)
# ships no type stubs. Scoped to the one module rather than a global
# `ignore_missing_imports`, which would also hide a genuinely missing
# first-party import — the failure mode that makes a checker useless.
module = ["rfc8785"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The MCP SDK ships no usable stubs for the private attributes R49's
# channel seam reaches through (`MCPServer._lowlevel_server`,
# `ServerSession._connection`). Those two are sanctioned and guarded by
# tests watched firing; mypy cannot see either guarantee.
module = ["mcp.*"]
ignore_missing_imports = true
